<title>Houssem-Eddine Lahmar — Electrical & Embedded Software Engineer</title>
<meta name="description" content="Electrical engineer and embedded software engineer (C/C++, RTOS, embedded Linux); PhD candidate in embedded AI and FPGA acceleration.">
<meta property="og:title" content="Houssem-Eddine Lahmar — Electrical & Embedded Software Engineer">

<style>
:root{--bg:#070b14;--fg:#e6edf7;--mut:#8a98b3;--card:#0d1524;--bd:#1b2942;--ac:#4aa8ff;--ac2:#22d3ee;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#f5f7fb;--fg:#0b1220;--mut:#52607a;--card:#fff;--bd:#d6deec;--ac:#1565d8;--ac2:#0e7490;color-scheme:light}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--ac);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;gap:14px;height:56px}
nav{display:flex;gap:16px;overflow-x:auto;flex:1;scrollbar-width:none}nav a{color:var(--mut);font-size:14px;white-space:nowrap}nav a:hover{color:var(--fg);text-decoration:none}
button{font:inherit;cursor:pointer}
.ib{background:none;border:1px solid var(--bd);color:var(--fg);border-radius:8px;padding:4px 10px;font-size:13px}
section{padding:72px 0 8px}
h2{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}p.sub{color:var(--mut);margin:0 0 28px;max-width:70ch}
.k{color:var(--ac2);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#hero{position:relative;padding:96px 0 40px;overflow:hidden}
#hero svg{position:absolute;inset:auto 0 0 0;width:100%;height:160px;opacity:.5;z-index:0}
#hero .w{position:relative;z-index:1}
h1{font-size:clamp(34px,6vw,60px);line-height:1.08;margin:8px 0 12px;letter-spacing:-.03em}
.hd{color:var(--mut);font-size:17px;margin:0 0 6px}.lead{max-width:62ch;margin:18px 0 26px}
.btn{display:inline-block;padding:9px 16px;border-radius:9px;border:1px solid var(--bd);color:var(--fg);margin:0 8px 8px 0;font-size:15px;background:none}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn:hover{text-decoration:none;border-color:var(--ac)}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.c h3{margin:0 0 6px;font-size:17px}.c p{margin:6px 0;color:var(--mut);font-size:14.5px}
.t{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:6px;padding:1px 8px;margin:3px 4px 0 0;color:var(--mut)}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0}
.pipe .n{border:1px solid var(--ac);border-radius:8px;padding:6px 12px;font-size:13px;background:var(--card)}.pipe i{color:var(--ac2);font-style:normal}
.note{border-left:3px solid var(--ac2);padding:8px 14px;color:var(--mut);font-size:14px;margin:14px 0 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}td{border-bottom:1px solid var(--bd);padding:8px 6px}td:last-child{text-align:right;color:var(--ac2)}
.f{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.f button{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:20px;padding:4px 14px;font-size:13px}
.f button.on{border-color:var(--ac);color:var(--fg);background:var(--card)}
.tl{border-left:2px solid var(--bd);margin-left:6px}.tl>div{position:relative;padding:0 0 22px 22px}
.tl>div:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac)}
.tl h3{margin:0;font-size:17px}.m{color:var(--ac2);font-size:12.5px}.tl p{margin:4px 0 0;color:var(--mut);font-size:14.5px}
ul{margin:8px 0 0;padding-left:18px;color:var(--mut);font-size:14.5px}li{margin:3px 0}
.lead-c{border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);color:var(--fg);border-radius:8px;padding:9px;font:inherit;margin-bottom:10px}
.ph{float:right;margin:0 0 12px 24px;width:clamp(110px,22vw,200px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:2px solid var(--ac);box-shadow:0 0 0 6px color-mix(in srgb,var(--ac) 14%,transparent)}
footer{padding:48px 0;color:var(--mut);font-size:13px;text-align:center}
@media(prefers-reduced-motion:no-preference){#hero path{stroke-dasharray:1400;animation:d 6s linear infinite}@keyframes d{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}}
